name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build/qt -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build frontend
        run: cmake --build build/qt --config Release --parallel
      - name: Build backend
        shell: bash
        run: |
          mkdir -p package
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o package/notehub-backend.exe ./cmd/notehub-backend
            cp build/qt/frontend/Release/NoteHub.exe package/NoteHub.exe || cp build/qt/frontend/NoteHub.exe package/NoteHub.exe
            "${QT_ROOT_DIR}/bin/windeployqt.exe" --release --no-translations package/NoteHub.exe
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o package/notehub-backend ./cmd/notehub-backend
            cp -R build/qt/frontend/NoteHub.app package/NoteHub.app
            cp package/notehub-backend package/NoteHub.app/Contents/MacOS/notehub-backend
            "${QT_ROOT_DIR}/bin/macdeployqt" package/NoteHub.app
            ditto -c -k --sequesterRsrc --keepParent package/NoteHub.app "NoteHub-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"
          else
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o package/notehub-backend ./cmd/notehub-backend
            cp build/qt/frontend/NoteHub package/NoteHub
            cp assets/icons/NoteHub.png package/NoteHub.png
            tar -C package -czf "NoteHub-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" NoteHub notehub-backend NoteHub.png
          fi
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "NoteHub-${env:GITHUB_REF_NAME}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NoteHub-${{ matrix.name }}
          path: |
            NoteHub-*.zip
            NoteHub-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
