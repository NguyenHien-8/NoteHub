name: Desktop release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cc: gcc
            platform: windows
          - os: macos-latest
            cc: clang
            platform: macos
          - os: ubuntu-24.04
            cc: gcc
            platform: linux
    env:
      CGO_ENABLED: '1'
      CC: ${{ matrix.cc }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve repository line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tag must be vX.Y.Z'; exit 1; }
          echo "NOTEHUB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev zenity xdg-utils xvfb
      - name: Check formatting and module cleanliness
        run: |
          files="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then printf 'Run gofmt on:\n%s\n' "$files"; exit 1; fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test and vet before packaging
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a go test ./...; else go test ./...; fi
          go vet ./...
          go build ./cmd/notehub
      - name: Build Windows executable and ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version $env:NOTEHUB_VERSION
          Copy-Item -LiteralPath README.md, LICENSE -Destination dist/windows
          $arch = go env GOARCH
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine GOARCH.' }
          Compress-Archive -LiteralPath dist/windows/NoteHub.exe, dist/windows/README.md, dist/windows/LICENSE -DestinationPath "dist/windows/NoteHub-${env:NOTEHUB_VERSION}-windows-$arch.zip" -Force
      - name: Build macOS app bundle and DMG
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh "$NOTEHUB_VERSION"
      - name: Build Linux binary and tarball
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh "$NOTEHUB_VERSION"
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: NoteHub-${{ env.NOTEHUB_VERSION }}-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/*.exe
            dist/${{ matrix.platform }}/*.zip
            dist/${{ matrix.platform }}/*.dmg
            dist/${{ matrix.platform }}/*.tar.gz
          if-no-files-found: error
          retention-days: 30
