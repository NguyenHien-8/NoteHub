name: Desktop release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release tag::Release tag must be vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Go formatting and modules
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test and vet Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o "${RUNNER_TEMP}/notehub-core" ./cmd/notehub-core

  package:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux

    env:
      NOTEHUB_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install Qt on macOS/Linux
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          install-deps: true

      - name: Configure release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/qt-release `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DNOTEHUB_VERSION=$env:NOTEHUB_VERSION" `
            -DBUILD_TESTING=OFF

      - name: Configure release (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/qt-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTEHUB_VERSION="$NOTEHUB_VERSION" \
            -DBUILD_TESTING=OFF

      - name: Build release
        shell: bash
        run: cmake --build build/qt-release --config Release --parallel

      - name: Install release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cmake --install build/qt-release --config Release --prefix dist/windows
          if (-not (Test-Path dist/windows/NoteHub.exe)) { throw "Missing NoteHub.exe" }
          if (-not (Test-Path dist/windows/notehub-core.exe)) { throw "Missing notehub-core.exe" }
          windeployqt --release --compiler-runtime --no-translations dist/windows/NoteHub.exe
          Copy-Item README.md, LICENSE -Destination dist/windows -Force
          Compress-Archive -Path dist/windows/* `
            -DestinationPath "artifacts/NoteHub-$env:NOTEHUB_VERSION-windows-x64.zip" -Force

      - name: Install release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts dist/macos
          cmake --install build/qt-release --prefix dist/macos
          test -d dist/macos/NoteHub.app
          test -x dist/macos/NoteHub.app/Contents/MacOS/NoteHub
          test -x dist/macos/NoteHub.app/Contents/MacOS/notehub-core
          arch="$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent             dist/macos/NoteHub.app             "artifacts/NoteHub-${NOTEHUB_VERSION}-macos-${arch}.app.zip"
          stage="${RUNNER_TEMP}/notehub-dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto dist/macos/NoteHub.app "$stage/NoteHub.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname NoteHub -srcfolder "$stage" -ov -format UDZO             "artifacts/NoteHub-${NOTEHUB_VERSION}-macos-${arch}.dmg"

      - name: Install release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts dist/linux
          cmake --install build/qt-release --prefix dist/linux
          test -x dist/linux/NoteHub
          test -x dist/linux/notehub-core
          cp README.md LICENSE dist/linux/
          arch="$(uname -m)"
          tar -C dist/linux -czf             "artifacts/NoteHub-${NOTEHUB_VERSION}-linux-${arch}.tar.gz" .

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: NoteHub-${{ env.NOTEHUB_VERSION }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
