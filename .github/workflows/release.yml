name: Desktop release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Qt 6.8.3 is not compatible with macOS 26's removed AGL framework.
  QT_VERSION: '6.8.4'

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release tag::Release tag must be vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Go formatting and modules
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test, vet and compile Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o "${RUNNER_TEMP}/notehub-core" ./cmd/notehub-core

  package:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux

    env:
      NOTEHUB_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          install-deps: true
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}

      - name: Configure release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/qt-release `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DNOTEHUB_VERSION=$env:NOTEHUB_VERSION" `
            -DBUILD_TESTING=OFF

      - name: Configure release (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/qt-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTEHUB_VERSION="$NOTEHUB_VERSION" \
            -DBUILD_TESTING=OFF

      - name: Build release
        shell: bash
        run: cmake --build build/qt-release --config Release --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $installDir = Join-Path $env:GITHUB_WORKSPACE 'dist\windows'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          # Absolute prefix is required by the generated Qt deployment script.
          cmake --install build/qt-release --config Release --prefix "$installDir"

          $gui = Join-Path $installDir 'NoteHub.exe'
          $core = Join-Path $installDir 'notehub-core.exe'
          if (-not (Test-Path $gui)) { throw "Missing $gui" }
          if (-not (Test-Path $core)) { throw "Missing $core" }

          # Safety net for Qt/MSVC runtime files.
          windeployqt --release --compiler-runtime --no-translations "$gui"

          Copy-Item README.md, LICENSE -Destination $installDir -Force
          $zip = Join-Path $artifactDir "NoteHub-$env:NOTEHUB_VERSION-windows-x64.zip"
          Compress-Archive -Path "$installDir\*" -DestinationPath $zip -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts"
          install_dir="$GITHUB_WORKSPACE/dist/macos"
          mkdir -p "$artifact_dir" "$install_dir"

          cmake --install build/qt-release --prefix "$install_dir"

          test -d "$install_dir/NoteHub.app"
          test -x "$install_dir/NoteHub.app/Contents/MacOS/NoteHub"
          test -x "$install_dir/NoteHub.app/Contents/MacOS/notehub-core"

          arch="$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent \
            "$install_dir/NoteHub.app" \
            "$artifact_dir/NoteHub-${NOTEHUB_VERSION}-macos-${arch}.app.zip"

          stage="${RUNNER_TEMP}/notehub-dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$install_dir/NoteHub.app" "$stage/NoteHub.app"
          ln -s /Applications "$stage/Applications"

          hdiutil create \
            -volname NoteHub \
            -srcfolder "$stage" \
            -ov -format UDZO \
            "$artifact_dir/NoteHub-${NOTEHUB_VERSION}-macos-${arch}.dmg"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/artifacts"
          install_dir="$GITHUB_WORKSPACE/dist/linux"
          mkdir -p "$artifact_dir" "$install_dir"

          cmake --install build/qt-release --prefix "$install_dir"

          test -x "$install_dir/NoteHub"
          test -x "$install_dir/notehub-core"

          cp README.md LICENSE "$install_dir/"
          arch="$(uname -m)"
          tar -C "$install_dir" -czf \
            "$artifact_dir/NoteHub-${NOTEHUB_VERSION}-linux-${arch}.tar.gz" .

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: NoteHub-${{ env.NOTEHUB_VERSION }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
