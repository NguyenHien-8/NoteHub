name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOTEHUB_VERSION: '0.3.0'
  QT_VERSION: '6.8.3'

jobs:
  quality:
    name: Go quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Go source is not formatted::Run gofmt on the files below."
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Vet Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Compile Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${RUNNER_TEMP}/notehub-core" ./cmd/notehub-core

  desktop:
    name: Qt desktop (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install Qt on macOS/Linux
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          install-deps: true

      - name: Configure Qt desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/qt-ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DNOTEHUB_VERSION=$env:NOTEHUB_VERSION" `
            -DBUILD_TESTING=ON

      - name: Configure Qt desktop (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/qt-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTEHUB_VERSION="$NOTEHUB_VERSION" \
            -DBUILD_TESTING=ON

      - name: Build Qt desktop
        shell: bash
        run: cmake --build build/qt-ci --config Release --parallel

      - name: Run Qt tests
        shell: bash
        run: ctest --test-dir build/qt-ci -C Release --output-on-failure

      - name: Verify Windows install layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build/qt-ci --config Release --prefix build/stage
          if (-not (Test-Path build/stage/NoteHub.exe)) { throw "NoteHub.exe was not installed." }
          if (-not (Test-Path build/stage/notehub-core.exe)) { throw "notehub-core.exe was not installed." }

      - name: Verify Linux install layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build/qt-ci --prefix build/stage
          test -x build/stage/NoteHub
          test -x build/stage/notehub-core

      - name: Verify macOS install layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --install build/qt-ci --prefix build/stage
          test -d build/stage/NoteHub.app
          test -x build/stage/NoteHub.app/Contents/MacOS/NoteHub
          test -x build/stage/NoteHub.app/Contents/MacOS/notehub-core
