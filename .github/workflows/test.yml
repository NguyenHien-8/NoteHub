name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOTEHUB_VERSION: '0.3.0'
  # Keep CI on a real Qt binary release available from the Qt online repository.
  # NoteHub is also developed locally with Qt 6.11.2.
  QT_VERSION: '6.11.2'

jobs:
  quality:
    name: Go quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Go source is not formatted::Run gofmt on the files below."
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error title=Go module files are not tidy::Run 'go mod tidy' and commit go.mod/go.sum."
            exit 1
          fi

      - name: Test Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Vet Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Compile Go backend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${RUNNER_TEMP}/notehub-core" ./cmd/notehub-core

  desktop:
    name: Qt desktop (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            platform: macos
            qt_arch: clang_64
          - os: ubuntu-24.04
            platform: linux
            qt_arch: linux_gcc_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: notehub-qt-${{ runner.os }}-${{ matrix.qt_arch }}
          install-deps: true

      - name: Verify Qt installation
        shell: bash
        run: |
          qmake6 -query QT_VERSION 2>/dev/null || qmake -query QT_VERSION
          cmake --version

      - name: Configure Qt desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/qt-ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DNOTEHUB_VERSION=$env:NOTEHUB_VERSION" `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Qt desktop (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/qt-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTEHUB_VERSION="$NOTEHUB_VERSION" \
            -DBUILD_TESTING=ON

      - name: Build Qt desktop
        shell: bash
        run: cmake --build build/qt-ci --config Release --parallel

      - name: Run Qt tests
        shell: bash
        run: ctest --test-dir build/qt-ci -C Release --output-on-failure

      - name: Verify Windows install layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build\stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          cmake --install build/qt-ci --config Release --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path (Join-Path $stage 'NoteHub.exe'))) {
            throw "NoteHub.exe was not installed."
          }
          if (-not (Test-Path (Join-Path $stage 'notehub-core.exe'))) {
            throw "notehub-core.exe was not installed."
          }
          if (-not (Test-Path (Join-Path $stage 'platforms\qwindows.dll'))) {
            throw "Qt Windows platform plugin was not deployed."
          }

      - name: Verify Linux install layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="$GITHUB_WORKSPACE/build/stage"
          mkdir -p "$stage"
          cmake --install build/qt-ci --prefix "$stage"
          test -x "$stage/NoteHub"
          test -x "$stage/notehub-core"

      - name: Verify macOS install layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage="$GITHUB_WORKSPACE/build/stage"
          mkdir -p "$stage"
          cmake --install build/qt-ci --prefix "$stage"
          test -d "$stage/NoteHub.app"
          test -x "$stage/NoteHub.app/Contents/MacOS/NoteHub"
          test -x "$stage/NoteHub.app/Contents/MacOS/notehub-core"
