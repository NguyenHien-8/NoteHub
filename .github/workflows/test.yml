name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Go formatting and module checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Go source is not formatted::Run gofmt on the files listed below before pushing."
            printf '%s\n' "$unformatted"
            echo
            echo "Fix locally with:"
            echo "  git ls-files '*.go' | xargs gofmt -w"
            exit 1
          fi

      - name: Check module files are tidy
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error title=Go module files are not tidy::Run 'go mod tidy' and commit go.mod/go.sum."
            exit 1
          fi

  native:
    name: Native checks (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cc: gcc
          - os: macos-latest
            cc: clang
          - os: ubuntu-24.04
            cc: gcc

    env:
      CGO_ENABLED: '1'
      CC: ${{ matrix.cc }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Preserve repository line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install Windows compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gccDir = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $gcc = Join-Path $gccDir 'gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc -PathType Leaf)) {
            throw "gcc.exe was not found at $gcc"
          }
          $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            zenity \
            xdg-utils \
            xvfb

      - name: Verify toolchain
        shell: bash
        run: |
          go version
          "$CC" --version

      - name: Test all packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a go test ./...
          else
            go test ./...
          fi

      - name: Vet all packages
        shell: bash
        run: go vet ./...

      - name: Compile native desktop
        shell: bash
        run: go build ./cmd/notehub
